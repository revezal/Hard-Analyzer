<div class="wpcf7">
<form class="kc-cf7" id="kc-cf7" novalidate>
	<div class="kc-row">
		<p><label for="kc-name">Tu nombre</label><input id="kc-name" type="text" name="your-name" autocomplete="name" required></p>
		<p><label for="kc-email">Tu email</label><input id="kc-email" type="email" name="your-email" autocomplete="email" required></p>
	</div>
	<p><label for="kc-subject">Asunto</label><input id="kc-subject" type="text" name="your-subject" required></p>
	<p><label for="kc-msg">Tu mensaje (opcional)</label><textarea id="kc-msg" name="your-message"></textarea></p>
	<p><input type="submit" value="Enviar"></p>
	<div class="kc-form__status" role="status" aria-live="polite"></div>
</form>
</div>
