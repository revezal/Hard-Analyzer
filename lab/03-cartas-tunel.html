<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 03 — Cartas en túnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* Pila de cartas en perspectiva: arriba se apilan hacia el fondo,
     con el scroll cada carta baja hacia ti, se inclina y sale por abajo. */
  :root { --ink:#000; --bone:#efe9df; --red:#ff1a0e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--ink); color:var(--bone); overflow-x:hidden; font-family:"Inter Tight",sans-serif; }
  .tunnel { position:relative; height:900vh; }
  .tunnel__sticky { position:sticky; top:0; height:100vh; overflow:hidden; perspective:900px; perspective-origin:50% 20%; }
  .card {
    position:absolute; left:50%; top:46%; width:min(58vw,330px); aspect-ratio:4/5;
    margin-left:calc(min(58vw,330px)/-2); margin-top:calc(min(58vw,330px)*-0.625);
    border-radius:18px; overflow:hidden; background:var(--c) center/cover;
    transform-origin:50% 100%; will-change:transform; backface-visibility:hidden;
    box-shadow:0 -1px 0 rgba(255,255,255,.08) inset;
  }
  .card__img { position:absolute; inset:0; background:center/cover; }
  .card__tag { position:absolute; left:12px; bottom:10px; font:700 9px "Space Mono",monospace; letter-spacing:.2em; color:var(--bone); mix-blend-mode:difference; }
  .corner { position:absolute; font:500 13px/1.1 "Inter Tight",sans-serif; z-index:50; }
  .corner--tl { top:16px; left:18px; } .corner--tr { top:16px; right:18px; text-align:right; }
  .corner--bl { bottom:16px; left:18px; } .corner--br { bottom:16px; right:18px; text-align:right; }
  .count { font:400 44px/1 "Anton",sans-serif; }
  .end { height:70vh; display:grid; place-items:center; font:400 clamp(40px,8vw,120px)/.9 "Anton",sans-serif; }
</style>
</head>
<body>
<section class="tunnel" id="tunnel">
  <div class="tunnel__sticky" id="stage">
    <p class="corner corner--tl">Fran Mera<br>Sesión 2026</p>
    <p class="corner corner--tr">Kelokera<br>Childhood Boys</p>
    <p class="corner corner--bl count" id="count">01</p>
    <p class="corner corner--br">Scroll ↓<br><span style="opacity:.5">Lab 03</span></p>
  </div>
</section>
<div class="end">VER MÁS FOTOS</div>

<script>
/* Fotos de Fran intercaladas con cartas de color (como el video de referencia).
   Si una foto no existe, la carta queda del color de fondo. */
const CARDS = [
  { c:"#0f5c6e", img:"../assets/fotos/fran-01.jpg", tag:"FRAN 01" },
  { c:"#efe9df", img:"../assets/fotos/fran-02.jpg", tag:"FRAN 02" },
  { c:"#ff1a0e", img:"../assets/fotos/fran-03.jpg", tag:"FRAN 03" },
  { c:"#f5c400", img:"../assets/fotos/fran-04.jpg", tag:"FRAN 04" },
  { c:"#5a1610", video:"../assets/video/kiki.mp4", tag:"KIKI" },
  { c:"#6f7a4c", img:"../assets/fotos/fran-05.jpg", tag:"FRAN 05" },
  { c:"#d9c3a5", img:"../assets/fotos/live-01.jpg", tag:"LIVE 01" },
  { c:"#2a5bd7", img:"../assets/fotos/live-02.jpg", tag:"LIVE 02" },
  { c:"#c8364a", img:"../assets/fotos/otra-copa.jpg", tag:"OTRA COPA" },
  { c:"#8a8a80", video:"../assets/video/kelokera.mp4", tag:"KELOKERA" },
  { c:"#8fb6c9", img:"../assets/fotos/fran-07.jpg", tag:"FRAN 07" },
  { c:"#f5b92e", img:"../assets/logo/childhood-boys-gold.png", tag:"CHILDHOOD BOYS" },
];
const stage=document.getElementById("stage"), tunnel=document.getElementById("tunnel"), count=document.getElementById("count");
const els=CARDS.map((k,i)=>{
  const d=document.createElement("div"); d.className="card"; d.style.setProperty("--c",k.c);
  d.innerHTML=`<div class="card__img"></div><span class="card__tag">${k.tag}</span>`;
  if(k.video){ d.firstChild.innerHTML=`<video muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover"><source src="${k.video.replace(/\.mp4$/,".webm")}" type="video/webm"><source src="${k.video}" type="video/mp4"></video>`; }
  else { const im=new Image(); im.onload=()=>d.firstChild.style.backgroundImage=`url(${k.img})`; im.src=k.img; }
  stage.appendChild(d); return d;
});
const N=CARDS.length;
function frame(){
  const r=tunnel.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,-r.top/(r.height-innerHeight)));
  const pos=p*(N-1);                   // carta activa (continua)
  const H=innerHeight;
  els.forEach((el,i)=>{
    const d=i-pos;                      // >0: en la pila (atrás) · <0: ya pasó (viene hacia ti)
    let y,z,rx,o=1;
    if(d>=0){                           // pila: cada carta más arriba y más al fondo
      y=-Math.pow(d,.85)*H*.075; z=-d*120; rx=-d*2;
      o=d>8?0:1;
    }else{                              // sale: baja, se acerca y se inclina hacia atrás
      const e=-d;
      y=e*H*.62; z=e*220; rx=Math.min(48,e*55);
      o=e>1.6?0:1;
    }
    el.style.transform=`translate3d(0,${y}px,${z}px) rotateX(${rx}deg)`;
    el.style.zIndex=1000-Math.round(d*10);
    el.style.opacity=o;
  });
  count.textContent=String(Math.min(N,Math.round(pos)+1)).padStart(2,"0");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
