<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fran Mera — Popup de entrada (demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/popup.css">
  <style>
    html, body { margin: 0; height: 100%; background: #050505; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .again {
      position: fixed; bottom: 16px; right: 16px; z-index: 10; cursor: pointer;
      font: 700 11px/1 "Space Mono", monospace; letter-spacing: .15em; text-transform: uppercase;
      padding: 12px 16px; border-radius: 99px; border: 0; background: #efe9df; color: #050505;
    }
  </style>
</head>
<body>
  <!-- DEMO: el sitio de fondo + el popup encima. Para producción basta con incluir css/popup.css + js/popup.js en index.html -->
  <iframe src="index.html" title="Sitio Fran Mera" tabindex="-1"></iframe>
  <button class="again" onclick="location.href='popup.html?intro'">↻ Ver popup otra vez</button>
  <script src="js/popup.js" data-site="#" data-always="true"></script>
</body>
</html>
